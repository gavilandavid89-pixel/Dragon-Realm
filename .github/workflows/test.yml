name: Dragon Realm checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      WORLD_SYNC_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/dragon_realm_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dragon_realm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dragon_realm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: |
          set -o pipefail
          npm run check 2>&1 | tee check-output.log
      - name: Run automated tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dragon-realm-ci-logs
          path: |
            check-output.log
            test-output.log
          if-no-files-found: ignore
